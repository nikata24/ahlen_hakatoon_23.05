<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahlen v1 API Developer Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" />
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #090d16;
            --bg-card: rgba(15, 23, 42, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 80% 10%, #1e1b4b 0%, #090d16 70%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Portal Header */
        header {
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2.2rem;
            height: 2.2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
        }

        /* Tabs System */
        .controls-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 0.25rem;
            border-radius: 30px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 1.25rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 30px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Content Areas */
        .content-container {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .view-panel {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .view-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Redoc styling adjustments */
        #redoc-container {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* CUSTOM SWAGGER UI DARK THEME OVERRIDES */
        .swagger-ui-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .swagger-ui {
            filter: invert(0); /* Standard fallback */
        }

        .swagger-ui .info {
            margin: 1.5rem 0 2rem 0 !important;
        }

        .swagger-ui .info .title {
            color: #ffffff !important;
            font-family: 'Outfit', sans-serif !important;
            font-weight: 700 !important;
        }

        .swagger-ui .info p, 
        .swagger-ui .info li, 
        .swagger-ui .info table, 
        .swagger-ui .info h1, 
        .swagger-ui .info h2, 
        .swagger-ui .info h3, 
        .swagger-ui .info h4, 
        .swagger-ui .info h5 {
            color: var(--text-muted) !important;
            font-size: 0.95rem !important;
            line-height: 1.6 !important;
        }

        .swagger-ui .scheme-container {
            background: rgba(9, 13, 22, 0.6) !important;
            border: 1px solid var(--border) !important;
            box-shadow: none !important;
            border-radius: 8px !important;
            padding: 1rem !important;
        }

        .swagger-ui .scheme-container label {
            color: var(--text-muted) !important;
        }

        .swagger-ui select {
            background: #0f172a !important;
            color: #ffffff !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
            padding: 5px 10px !important;
        }

        /* Operations/Endpoints */
        .swagger-ui .opblock {
            background: rgba(255, 255, 255, 0.01) !important;
            border: 1px solid rgba(255,255,255,0.06) !important;
            border-radius: 10px !important;
            box-shadow: none !important;
            overflow: hidden !important;
        }

        .swagger-ui .opblock .opblock-summary {
            border-bottom: 1px solid rgba(255,255,255,0.04) !important;
            padding: 0.75rem 1.25rem !important;
        }

        .swagger-ui .opblock.opblock-get {
            border-color: rgba(99, 102, 241, 0.3) !important;
            background: rgba(99, 102, 241, 0.03) !important;
        }

        .swagger-ui .opblock.opblock-get .opblock-summary-method {
            background: var(--primary) !important;
            border-radius: 6px !important;
            font-weight: 700 !important;
            padding: 6px 14px !important;
        }

        .swagger-ui .opblock.opblock-get .opblock-summary {
            border-color: rgba(99, 102, 241, 0.15) !important;
        }

        .swagger-ui .opblock .opblock-summary-path,
        .swagger-ui .opblock .opblock-summary-path__deprecated {
            color: #ffffff !important;
            font-family: monospace;
            font-size: 0.95rem !important;
            font-weight: 600 !important;
        }

        .swagger-ui .opblock .opblock-summary-description {
            color: var(--text-muted) !important;
            font-size: 0.85rem !important;
        }

        .swagger-ui .opblock-body {
            background: rgba(0, 0, 0, 0.15) !important;
        }

        .swagger-ui .opblock-description-wrapper p, 
        .swagger-ui .opblock-external-docs-wrapper p, 
        .swagger-ui .opblock-title_normal {
            color: var(--text-main) !important;
            font-size: 0.9rem !important;
        }

        /* Parameters & Table */
        .swagger-ui .parameters-container th {
            color: #ffffff !important;
            border-bottom: 1px solid var(--border) !important;
            font-size: 0.85rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
        }

        .swagger-ui .parameter__name {
            color: #ffffff !important;
            font-weight: 600 !important;
        }

        .swagger-ui .parameter__name.required:after {
            color: #ef4444 !important;
        }

        .swagger-ui .parameter__type,
        .swagger-ui .parameter__in {
            color: var(--text-muted) !important;
            font-family: monospace !important;
        }

        .swagger-ui .parameter__extension, 
        .swagger-ui .parameter__in {
            font-style: italic !important;
        }

        .swagger-ui .parameters-col_description p {
            color: var(--text-muted) !important;
            font-size: 0.85rem !important;
        }

        .swagger-ui input[type=text] {
            background: #0f172a !important;
            border: 1px solid var(--border) !important;
            color: #ffffff !important;
            border-radius: 6px !important;
            padding: 8px 12px !important;
        }

        .swagger-ui input[type=text]:focus {
            outline: 2px solid var(--primary) !important;
        }

        /* Tables & Responses */
        .swagger-ui table tbody tr td {
            border-bottom: 1px solid rgba(255,255,255,0.04) !important;
        }

        .swagger-ui .response-col_status {
            color: #ffffff !important;
            font-weight: 600 !important;
        }

        .swagger-ui .response-col_links {
            color: var(--text-muted) !important;
        }

        .swagger-ui .opblock-body pre {
            background: #070a13 !important;
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
            color: #38bdf8 !important;
            padding: 1rem !important;
        }

        .swagger-ui .opblock-body pre code {
            color: #38bdf8 !important;
            font-family: monospace !important;
        }

        .swagger-ui .tabli button {
            color: var(--text-muted) !important;
            font-weight: 600 !important;
        }

        .swagger-ui .tabli.active button {
            color: #ffffff !important;
            border-bottom-color: var(--primary) !important;
        }

        .swagger-ui .model-box {
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
            padding: 0.5rem !important;
        }

        .swagger-ui .model {
            color: var(--text-muted) !important;
        }

        .swagger-ui .model-title {
            color: #ffffff !important;
        }

        .swagger-ui .prop-name {
            color: #818cf8 !important;
        }

        .swagger-ui .prop-type {
            color: #06b6d4 !important;
        }

        /* Try it out / Cancel / Execute Buttons */
        .swagger-ui .btn {
            border: 1px solid var(--border) !important;
            border-radius: 30px !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 500 !important;
            padding: 6px 18px !important;
            transition: all 0.2s ease !important;
            box-shadow: none !important;
        }

        .swagger-ui .btn.try-out__btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)) !important;
            border: none !important;
            color: #ffffff !important;
        }

        .swagger-ui .btn.try-out__btn:hover {
            opacity: 0.9;
        }

        .swagger-ui .btn.execute {
            background: #10b981 !important;
            color: #ffffff !important;
            border: none !important;
        }

        .swagger-ui .btn.execute:hover {
            background: #059669 !important;
        }

        .swagger-ui .btn.btn-clear {
            background: rgba(239, 68, 68, 0.1) !important;
            border-color: rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
        }

        .swagger-ui .btn.btn-clear:hover {
            background: rgba(239, 68, 68, 0.2) !important;
        }

        /* Footer styling */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 5rem;
            background: rgba(9, 13, 22, 0.5);
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">A</div>
            <div class="logo-text">Ahlen City Portal</div>
            <div class="logo-badge">API v1</div>
        </div>
        
        <div class="controls-container">
            <div class="tabs">
                <button id="swagger-tab" class="tab-btn active" onclick="switchTab('swagger')">Swagger UI (Интерактивный)</button>
                <button id="redoc-tab" class="tab-btn" onclick="switchTab('redoc')">Redoc (Документация)</button>
            </div>
            
            <a href="./openapi.yaml" class="download-btn" download="openapi.yaml">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                OpenAPI Spec
            </a>
        </div>
    </header>

    <div class="content-container">
        <!-- Swagger UI View Panel -->
        <div id="swagger-panel" class="view-panel active">
            <div class="swagger-ui-wrapper">
                <div id="swagger-ui"></div>
            </div>
        </div>

        <!-- Redoc View Panel -->
        <div id="redoc-panel" class="view-panel">
            <div id="redoc-container"></div>
        </div>
    </div>

    <footer>
        Разработано в рамках хакатона &copy; 2026. <a href="https://github.com" target="_blank">Документация проекта</a>
    </footer>

    <!-- Swagger UI Bundles -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>

    <!-- Redoc CDN -->
    <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js"></script>

    <script>
        // Initialize Swagger UI
        const ui = SwaggerUIBundle({
            url: "./openapi.yaml",
            dom_id: '#swagger-ui',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout",
            deepLinking: true,
            displayOperationId: false,
            defaultModelsExpandDepth: 1,
            defaultModelExpandDepth: 1
        });

        // Initialize Redoc
        let redocInitialized = false;
        function initRedoc() {
            if (redocInitialized) return;
            Redoc.init('./openapi.yaml', {
                theme: {
                    colors: {
                        primary: {
                            main: '#6366f1'
                        },
                        text: {
                            primary: '#f1f5f9',
                            secondary: '#94a3b8'
                        },
                        responses: {
                            success: {
                                color: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.06)'
                            }
                        }
                    },
                    schema: {
                        typeNameColor: '#06b6d4'
                    },
                    typography: {
                        fontFamily: 'Inter, sans-serif',
                        headings: {
                            fontFamily: 'Outfit, sans-serif',
                            fontWeight: '700'
                        }
                    },
                    rightPanel: {
                        backgroundColor: '#090d16',
                        textColor: '#f1f5f9'
                    }
                }
            }, document.getElementById('redoc-container'), () => {
                redocInitialized = true;
            });
        }

        // Tab Switch Logic
        function switchTab(view) {
            const swaggerTab = document.getElementById('swagger-tab');
            const redocTab = document.getElementById('redoc-tab');
            const swaggerPanel = document.getElementById('swagger-panel');
            const redocPanel = document.getElementById('redoc-panel');

            if (view === 'swagger') {
                swaggerTab.classList.add('active');
                redocTab.classList.remove('active');
                swaggerPanel.classList.add('active');
                redocPanel.classList.remove('active');
            } else if (view === 'redoc') {
                redocTab.classList.add('active');
                swaggerTab.classList.remove('active');
                redocPanel.classList.add('active');
                swaggerPanel.classList.remove('active');
                initRedoc();
            }
        }
    </script>
</body>
</html>
